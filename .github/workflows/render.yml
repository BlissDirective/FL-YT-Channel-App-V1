name: Render Farm

# Remotion render worker: picks up videos at ASSEMBLING and produces the
# final MP4 + Short. Cron because the app (serverless) can't run Chrome;
# free at this scale on Actions minutes.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - packages/render/**
      - .github/workflows/render.yml

concurrency:
  group: render-farm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Idle-cron guard (Phase 8): a scheduled pass peeks at the queue with one
      # cheap REST call BEFORE checkout+install — an empty queue used to cost a
      # full runner spin-up every pass, ~24/7. Dispatched runs skip the peek
      # (the dispatcher already knows there's work).
      - name: Check for queued work
        id: peek
        if: github.event_name == 'schedule'
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          COUNT=$(curl -s "https://reffwibuitzrkertuuvy.supabase.co/rest/v1/videos?select=id&or=(status.eq.ASSEMBLING,and(publish_requested.eq.true,youtube_video_id.is.null))" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" -D - -o /dev/null \
            | tr -d '\r' | awk -F'/' 'tolower($0) ~ /^content-range:/ {print $NF}')
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "render/publish queue: ${COUNT:-0}"
      - name: Queue empty — exit early
        if: github.event_name == 'schedule' && steps.peek.outputs.count == '0'
        run: echo "Nothing queued — skipping checkout/install."
      - uses: actions/checkout@v7
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      # ffmpeg powers the free structural media-QC pass (black/silence/loudness)
      # after each render (Harness C6). Absent → media QC skips cleanly.
      - name: Install ffmpeg
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg && ffmpeg -version | head -1
      # No `version:` — action-setup reads it from package.json's
      # packageManager field; specifying both errors out.
      - uses: pnpm/action-setup@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        with:
          node-version: 22
          cache: pnpm
      - name: Install render package deps
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        run: pnpm install --frozen-lockfile --filter @studio/render...
      - name: Render queue
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        working-directory: packages/render
        env:
          SUPABASE_URL: https://reffwibuitzrkertuuvy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          # Optional — enables the Tier-1 vision critique of stick shorts (Claude
          # scores rendered keyframes). Unset → the critic runs in benign mock.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          # Optional — when all four are set, finished renders (long + short) are
          # stored in Cloudflare R2 (no per-file size cap) instead of Supabase
          # Storage, so any video is downloadable regardless of size.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          # Optional — when set, the operator can one-tap publish a rendered
          # video to YouTube (publish_requested → uploaded on the next pass).
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          # Optional upload tuning — accept either a repo Variable or a Secret.
          YOUTUBE_UPLOAD_PRIVACY: ${{ vars.YOUTUBE_UPLOAD_PRIVACY || secrets.YOUTUBE_UPLOAD_PRIVACY }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || secrets.YOUTUBE_CATEGORY_ID }}
        run: pnpm render-queue
