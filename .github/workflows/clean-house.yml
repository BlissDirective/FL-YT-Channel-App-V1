name: Clean House Auto-Advance

# Drives every running Clean House run hands-off. Pings the app's cron route,
# which ticks each run one step through the existing gate/stage machinery —
# bounded by the per-run budget ceiling, a per-tick concurrency throttle, stall
# handling, and termination rails. Never publishes; never auto-kills (flags
# only). Runs inside the Next app; safe against a concurrent "Advance now"
# click via each run's atomic lock.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: clean-house-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.APP_BASE_URL || 'https://fl-yt-channel-app-v1.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Clean House sweep
        run: |
          echo "Pinging ${BASE_URL}/api/cron/clean-house"
          CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST \
            "${BASE_URL}/api/cron/clean-house" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP $CODE — $(cat /tmp/r.json)"
          case "$CODE" in
            200) echo "✅ clean-house sweep complete";;
            401) echo "❌ unauthorized — set CRON_SECRET to match the app's env"; exit 1;;
            *) echo "❌ sweep failed (HTTP $CODE)"; exit 1;;
          esac
