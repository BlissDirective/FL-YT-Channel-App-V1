name: Build Runner

# Full-Auto Build & Post (Phase 0): drives pending build-run seed videos
# through script → Full Auto-Generate → render. The heavy work runs inside the
# Next app (Claude/ElevenLabs/fal over HTTP), so this job just pings the cron
# route, which processes one video per call. A batch drains over several passes;
# when no run is active the route returns immediately (cheap).
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: build-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.APP_BASE_URL || 'https://fl-yt-channel-app-v1.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Drive pending build videos
        run: |
          echo "Pinging ${BASE_URL}/api/cron/build-runner"
          CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST \
            "${BASE_URL}/api/cron/build-runner" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP $CODE — $(cat /tmp/r.json)"
          case "$CODE" in
            200) echo "✅ build-runner ok";;
            401) echo "❌ unauthorized — CRON_SECRET mismatch"; exit 1;;
            *) echo "❌ build-runner failed (HTTP $CODE)"; exit 1;;
          esac
