name: DB Migrate

# Applies supabase/migrations/*.sql to the Supabase project using the
# database password secret. Connects through the Supavisor pooler
# (GitHub runners have no IPv6, so the direct db host is unreachable).
# Tracks applied files in public._migrations.

on:
  workflow_dispatch:
  push:
    paths:
      - supabase/migrations/**
      - .github/workflows/db-migrate.yml

env:
  SUPABASE_PROJECT_REF: reffwibuitzrkertuuvy

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          set +e
          PINNED=$(cat .github/supabase-pooler-host 2>/dev/null || true)
          CANDIDATES="$PINNED"
          for prefix in aws-0 aws-1 aws-2; do
            for region in us-east-1 us-east-2 us-west-1 us-west-2 eu-west-1 eu-west-2 eu-central-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 sa-east-1 ca-central-1; do
              CANDIDATES="$CANDIDATES $prefix.$region.pooler.supabase.com"
            done
          done
          FOUND=""
          for host in $CANDIDATES; do
            [ -z "$host" ] && continue
            OUT=$(psql "host=$host port=5432 user=postgres.$SUPABASE_PROJECT_REF dbname=postgres sslmode=require connect_timeout=5" -tAc 'select 1' 2>&1)
            if [ "$OUT" = "1" ]; then FOUND="$host"; break; fi
            # Auth errors mean the host is right but the password is wrong — stop and surface it
            case "$OUT" in *"password authentication failed"*)
              echo "❌ Pooler host $host reached but password rejected — check SUPABASE_PASSWORD secret"; exit 1;;
            esac
          done
          if [ -z "$FOUND" ]; then
            echo "❌ Could not reach any Supabase pooler host for project $SUPABASE_PROJECT_REF"; exit 1
          fi
          echo "✅ Pooler host: $FOUND"
          echo "host=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          POOLER_HOST: ${{ steps.pooler.outputs.host }}
        run: |
          set -e
          CONN="host=$POOLER_HOST port=5432 user=postgres.$SUPABASE_PROJECT_REF dbname=postgres sslmode=require"
          psql "$CONN" -v ON_ERROR_STOP=1 -c \
            'create table if not exists public._migrations (name text primary key, applied_at timestamptz not null default now());'
          for f in $(ls supabase/migrations/*.sql | sort); do
            NAME=$(basename "$f")
            APPLIED=$(psql "$CONN" -tAc "select 1 from public._migrations where name = '$NAME'")
            if [ "$APPLIED" = "1" ]; then
              echo "⏭  $NAME already applied"
              continue
            fi
            echo "▶️  Applying $NAME"
            psql "$CONN" -v ON_ERROR_STOP=1 --single-transaction \
              -f "$f" \
              -c "insert into public._migrations (name) values ('$NAME');"
            echo "✅ $NAME applied"
          done
          echo "==== Migration state ===="
          psql "$CONN" -c 'select name, applied_at from public._migrations order by name;'
