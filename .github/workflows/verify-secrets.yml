name: Verify Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-secrets.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ALL_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - name: List configured secret names
        run: |
          echo "Configured secret names:"
          echo "$ALL_SECRETS" | jq -r 'keys[]' | grep -v '^github_token$' || true

      - name: Verify service connectivity
        run: |
          set +e
          PASS=0; FAIL=0; SKIP=0

          get() { echo "$ALL_SECRETS" | jq -r --arg k "$1" '.[$k] // empty'; }
          # find first existing secret among candidate names
          find_key() {
            for k in "$@"; do
              v=$(get "$k")
              if [ -n "$v" ]; then echo "$k"; return 0; fi
            done
            return 1
          }
          report() { # name, status(ok/fail/skip), detail
            case "$2" in
              ok)   echo "✅ $1 — $3"; PASS=$((PASS+1));;
              fail) echo "❌ $1 — $3"; FAIL=$((FAIL+1));;
              skip) echo "⚪ $1 — $3"; SKIP=$((SKIP+1));;
            esac
          }

          # ---- Vercel token ----
          K=$(find_key VERCEL_TOKEN VERCEL_API_TOKEN VERCEL_API_KEY VERCEL_KEY VERCEL)
          if [ -n "$K" ]; then
            CODE=$(curl -s -o /tmp/vercel.json -w '%{http_code}' -H "Authorization: Bearer $(get $K)" https://api.vercel.com/v2/user)
            if [ "$CODE" = "200" ]; then
              U=$(jq -r '.user.username // .user.email // "ok"' /tmp/vercel.json)
              report "Vercel ($K)" ok "authenticated as $U"
            else
              report "Vercel ($K)" fail "API returned HTTP $CODE"
            fi
          else
            report "Vercel" skip "no secret found matching VERCEL_*"
          fi

          # ---- Supabase keys ----
          # Legacy keys are JWTs embedding their project ref; decode it and
          # test against that project's URL. New-format keys (sb_*) carry no
          # ref, so fall back to the known project refs.
          for KEYNAME in SUPABASE_ANON_PUBLIC_KEY SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY; do
            V=$(get "$KEYNAME")
            if [ -z "$V" ]; then report "Supabase ($KEYNAME)" skip "no secret found"; continue; fi
            REFS=""
            case "$V" in
              eyJ*)
                PAYLOAD=$(echo "$V" | cut -d. -f2 | tr '_-' '/+')
                PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 )); PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD) 2>/dev/null)"
                JREF=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.ref // empty')
                JROLE=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.role // empty')
                [ -n "$JREF" ] && REFS="$JREF" && echo "ℹ️  $KEYNAME is a JWT for project ref '$JREF' (role: $JROLE)"
                ;;
            esac
            [ -z "$REFS" ] && REFS="gqoaknfboahuqvgpidgw xbftsjerxodfwyqycmjl"
            MATCHED=""
            for REF in $REFS; do
              # auth health accepts any valid key role; /rest/v1/ root is
              # service_role-only on newer projects (false negative for anon)
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $V" "https://$REF.supabase.co/auth/v1/health")
              if [ "$CODE" = "200" ]; then MATCHED="$REF"; break; fi
            done
            if [ -n "$MATCHED" ]; then
              report "Supabase ($KEYNAME)" ok "valid for project ref $MATCHED"
            else
              report "Supabase ($KEYNAME)" fail "rejected (last HTTP $CODE; tried: $REFS)"
            fi
          done

          # ---- Supabase management access token (optional) ----
          MK=$(find_key SUPABASE_ACCESS_TOKEN SUPABASE_MANAGEMENT_TOKEN SUPABASE_PAT)
          if [ -n "$MK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(get $MK)" https://api.supabase.com/v1/projects)
            [ "$CODE" = "200" ] && report "Supabase access token ($MK)" ok "management API reachable" \
                                || report "Supabase access token ($MK)" fail "HTTP $CODE from management API"
          fi

          # ---- YouTube Data API key ----
          YK=$(find_key YOUTUBE_DATA_API_V3 YOUTUBE_API_KEY YOUTUBE_DATA_API_KEY)
          if [ -n "$YK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://www.googleapis.com/youtube/v3/videos?part=id&id=dQw4w9WgXcQ&key=$(get $YK)")
            [ "$CODE" = "200" ] && report "YouTube Data API ($YK)" ok "key valid, quota available" \
                                || report "YouTube Data API ($YK)" fail "HTTP $CODE from googleapis.com"
          else
            report "YouTube Data API" skip "no secret found"
          fi

          # ---- Trigger.dev project ref (presence only) ----
          PRK=$(find_key TRIGGER_DEV_PROJECT_REF TRIGGER_PROJECT_REF)
          if [ -n "$PRK" ]; then
            report "Trigger.dev project ref ($PRK)" ok "present"
          fi

          # ---- Supabase DB password (presence only) ----
          DK=$(find_key SUPABASE_PASSWORD SUPABASE_DB_PASSWORD SUPABASE_DATABASE_PASSWORD DB_PASSWORD DATABASE_PASSWORD)
          if [ -n "$DK" ]; then
            report "Supabase DB password ($DK)" ok "present (connectivity tested during Phase 1 migrations)"
          else
            report "Supabase DB password" skip "no secret found"
          fi

          # ---- Trigger.dev ----
          TK=$(find_key TRIGGER_SECRET_KEY TRIGGER_API_KEY TRIGGER_DEV_API_KEY TRIGGER_KEY TRIGGER_DEV_SECRET_KEY)
          if [ -n "$TK" ]; then
            TV=$(get "$TK")
            case "$TV" in
              tr_*) FMT="key format valid (tr_…)";;
              *)    FMT="unexpected key format (expected tr_…)";;
            esac
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TV" https://api.trigger.dev/api/v1/whoami)
            if [ "$CODE" = "200" ]; then
              report "Trigger.dev ($TK)" ok "authenticated; $FMT"
            else
              case "$TV" in
                tr_*) report "Trigger.dev ($TK)" ok "$FMT (whoami endpoint returned $CODE — full validation at first deploy)";;
                *)    report "Trigger.dev ($TK)" fail "$FMT and API returned $CODE";;
              esac
            fi
          else
            report "Trigger.dev" skip "no secret found matching TRIGGER_*"
          fi

          echo ""
          echo "==== SUMMARY: $PASS passed, $FAIL failed, $SKIP missing/skipped ===="
          [ "$FAIL" -eq 0 ] || exit 1
