name: Verify Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-secrets.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ALL_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - name: List configured secret names
        run: |
          echo "Configured secret names:"
          echo "$ALL_SECRETS" | jq -r 'keys[]' | grep -v '^github_token$' || true

      - name: Verify service connectivity
        run: |
          set +e
          PASS=0; FAIL=0; SKIP=0

          get() { echo "$ALL_SECRETS" | jq -r --arg k "$1" '.[$k] // empty'; }
          # find first existing secret among candidate names
          find_key() {
            for k in "$@"; do
              v=$(get "$k")
              if [ -n "$v" ]; then echo "$k"; return 0; fi
            done
            return 1
          }
          report() { # name, status(ok/fail/skip), detail
            case "$2" in
              ok)   echo "✅ $1 — $3"; PASS=$((PASS+1));;
              fail) echo "❌ $1 — $3"; FAIL=$((FAIL+1));;
              skip) echo "⚪ $1 — $3"; SKIP=$((SKIP+1));;
            esac
          }

          # ---- Vercel token ----
          K=$(find_key VERCEL_TOKEN VERCEL_FULL_ACCESS_TOKEN VERCEL_API_TOKEN VERCEL_API_KEY VERCEL_KEY VERCEL)
          if [ -n "$K" ]; then
            CODE=$(curl -s -o /tmp/vercel.json -w '%{http_code}' -H "Authorization: Bearer $(get $K)" https://api.vercel.com/v2/user)
            if [ "$CODE" = "200" ]; then
              U=$(jq -r '.user.username // .user.email // "ok"' /tmp/vercel.json)
              report "Vercel ($K)" ok "authenticated as $U"
            else
              report "Vercel ($K)" fail "API returned HTTP $CODE"
            fi
          else
            report "Vercel" skip "no secret found matching VERCEL_*"
          fi

          # ---- Supabase keys ----
          # Legacy keys are JWTs embedding their project ref; decode it and
          # test against that project's URL. New-format keys (sb_*) carry no
          # ref, so fall back to the known project refs.
          for KEYNAME in SUPABASE_ANON_PUBLIC_KEY SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY; do
            V=$(get "$KEYNAME")
            if [ -z "$V" ]; then report "Supabase ($KEYNAME)" skip "no secret found"; continue; fi
            REFS=""
            case "$V" in
              eyJ*)
                PAYLOAD=$(echo "$V" | cut -d. -f2 | tr '_-' '/+')
                PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 )); PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD) 2>/dev/null)"
                JREF=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.ref // empty')
                JROLE=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.role // empty')
                [ -n "$JREF" ] && REFS="$JREF" && echo "ℹ️  $KEYNAME is a JWT for project ref '$JREF' (role: $JROLE)"
                ;;
            esac
            [ -z "$REFS" ] && REFS="gqoaknfboahuqvgpidgw xbftsjerxodfwyqycmjl"
            MATCHED=""
            for REF in $REFS; do
              # auth health accepts any valid key role; /rest/v1/ root is
              # service_role-only on newer projects (false negative for anon)
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $V" "https://$REF.supabase.co/auth/v1/health")
              if [ "$CODE" = "200" ]; then MATCHED="$REF"; break; fi
            done
            if [ -n "$MATCHED" ]; then
              report "Supabase ($KEYNAME)" ok "valid for project ref $MATCHED"
            else
              report "Supabase ($KEYNAME)" fail "rejected (last HTTP $CODE; tried: $REFS)"
            fi
          done

          # ---- Supabase management access token (optional) ----
          MK=$(find_key SUPABASE_ACCESS_TOKEN SUPABASE_MANAGEMENT_TOKEN SUPABASE_PAT)
          if [ -n "$MK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(get $MK)" https://api.supabase.com/v1/projects)
            [ "$CODE" = "200" ] && report "Supabase access token ($MK)" ok "management API reachable" \
                                || report "Supabase access token ($MK)" fail "HTTP $CODE from management API"
          fi

          # ---- YouTube Data API key ----
          YK=$(find_key YOUTUBE_DATA_API_V3 YOUTUBE_API_KEY YOUTUBE_DATA_API_KEY)
          if [ -n "$YK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://www.googleapis.com/youtube/v3/videos?part=id&id=dQw4w9WgXcQ&key=$(get $YK)")
            [ "$CODE" = "200" ] && report "YouTube Data API ($YK)" ok "key valid, quota available" \
                                || report "YouTube Data API ($YK)" fail "HTTP $CODE from googleapis.com"
          else
            report "YouTube Data API" skip "no secret found"
          fi

          # ---- YouTube OAuth (upload credentials) ----
          # Long-form upload + one-tap Shorts publish need all three. Live-check
          # by minting an access token from the refresh token (catches an
          # expired/revoked token — e.g. a 7-day testing-mode token).
          OCID=$(find_key YOUTUBE_OAUTH_CLIENT_ID)
          OCS=$(find_key YOUTUBE_OAUTH_CLIENT_SECRET)
          ORT=$(find_key YOUTUBE_OAUTH_REFRESH_TOKEN)
          if [ -n "$OCID" ] && [ -n "$OCS" ] && [ -n "$ORT" ]; then
            CODE=$(curl -s -o /tmp/yt_oauth.json -w '%{http_code}' https://oauth2.googleapis.com/token \
              -d client_id="$(get $OCID)" \
              -d client_secret="$(get $OCS)" \
              -d refresh_token="$(get $ORT)" \
              -d grant_type=refresh_token)
            if [ "$CODE" = "200" ] && jq -e '.access_token' /tmp/yt_oauth.json >/dev/null 2>&1; then
              report "YouTube OAuth (upload)" ok "refresh token valid — access token minted"
            else
              ERR=$(jq -r '.error_description // .error // empty' /tmp/yt_oauth.json 2>/dev/null)
              report "YouTube OAuth (upload)" fail "token refresh HTTP $CODE${ERR:+ — $ERR}"
            fi
          else
            MISS=""
            [ -z "$OCID" ] && MISS="$MISS YOUTUBE_OAUTH_CLIENT_ID"
            [ -z "$OCS" ]  && MISS="$MISS YOUTUBE_OAUTH_CLIENT_SECRET"
            [ -z "$ORT" ]  && MISS="$MISS YOUTUBE_OAUTH_REFRESH_TOKEN"
            report "YouTube OAuth (upload)" skip "needed for long-form upload + Shorts publish; missing:$MISS (see docs/YouTube-API-creation.md)"
          fi

          # ---- YouTube Analytics scope (Phase D operator metrics) ----
          # Reuse the access token minted above (global YOUTUBE_OAUTH_REFRESH_TOKEN)
          # and hit the Analytics API: 200 = scope present, 403 = missing → re-consent.
          # (A per-project token set in the app's Settings is validated at runtime.)
          if [ -f /tmp/yt_oauth.json ] && jq -e '.access_token' /tmp/yt_oauth.json >/dev/null 2>&1; then
            AT=$(jq -r '.access_token' /tmp/yt_oauth.json)
            T1=$(date -u +%Y-%m-%d); T0=$(date -u -d '-28 days' +%Y-%m-%d 2>/dev/null || echo "2024-01-01")
            CODE=$(curl -s -o /tmp/yta.json -w '%{http_code}' \
              "https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==MINE&startDate=$T0&endDate=$T1&metrics=views,estimatedMinutesWatched" \
              -H "Authorization: Bearer $AT")
            case "$CODE" in
              200) report "YouTube Analytics scope" ok "yt-analytics.readonly present (global token)";;
              403) report "YouTube Analytics scope" fail "token lacks yt-analytics.readonly — re-consent with the analytics scope";;
              *)   report "YouTube Analytics scope" skip "HTTP $CODE (no data yet or transient)";;
            esac
          fi

          # ---- Cloudflare R2 (download storage for renders) ----
          # All four enable R2; probe with an authenticated head-bucket (the AWS
          # CLI is preinstalled on the runner and R2 is S3-compatible).
          R2ACC=$(get R2_ACCOUNT_ID); R2AK=$(get R2_ACCESS_KEY_ID)
          R2SK=$(get R2_SECRET_ACCESS_KEY); R2B=$(get R2_BUCKET)
          if [ -n "$R2ACC" ] && [ -n "$R2AK" ] && [ -n "$R2SK" ] && [ -n "$R2B" ]; then
            # Path-style addressing — R2's wildcard cert doesn't cover the
            # default virtual-hosted `<bucket>.<account>...` hostname.
            aws configure set default.s3.addressing_style path
            OUT=$(AWS_ACCESS_KEY_ID="$R2AK" AWS_SECRET_ACCESS_KEY="$R2SK" AWS_DEFAULT_REGION=auto \
              aws s3api head-bucket --bucket "$R2B" \
              --endpoint-url "https://$R2ACC.r2.cloudflarestorage.com" 2>&1)
            if [ $? -eq 0 ]; then
              report "Cloudflare R2 ($R2B)" ok "bucket reachable — credentials valid"
            else
              report "Cloudflare R2 ($R2B)" fail "head-bucket failed: $(echo "$OUT" | tr '\n' ' ' | head -c 140)"
            fi
          else
            MISS=""
            [ -z "$R2ACC" ] && MISS="$MISS R2_ACCOUNT_ID"
            [ -z "$R2AK" ]  && MISS="$MISS R2_ACCESS_KEY_ID"
            [ -z "$R2SK" ]  && MISS="$MISS R2_SECRET_ACCESS_KEY"
            [ -z "$R2B" ]   && MISS="$MISS R2_BUCKET"
            report "Cloudflare R2" skip "optional — unlimited download storage for renders; missing:$MISS (see docs/YouTube-API-creation.md)"
          fi

          # ---- Trigger.dev project ref (presence only) ----
          PRK=$(find_key TRIGGER_DEV_PROJECT_REF TRIGGER_PROJECT_REF)
          if [ -n "$PRK" ]; then
            report "Trigger.dev project ref ($PRK)" ok "present"
          fi

          # ---- Supabase DB password (presence only) ----
          DK=$(find_key SUPABASE_PASSWORD SUPABASE_DB_PASSWORD SUPABASE_DATABASE_PASSWORD DB_PASSWORD DATABASE_PASSWORD)
          if [ -n "$DK" ]; then
            report "Supabase DB password ($DK)" ok "present (connectivity tested during Phase 1 migrations)"
          else
            report "Supabase DB password" skip "no secret found"
          fi

          # ---- Anthropic (Phase 4) ----
          AK=$(find_key ANTHROPIC_API_KEY ANTHROPIC_KEY CLAUDE_API_KEY)
          if [ -n "$AK" ]; then
            CODE=$(curl -s -o /tmp/anthropic.json -w '%{http_code}' \
              -H "x-api-key: $(get $AK)" -H "anthropic-version: 2023-06-01" \
              https://api.anthropic.com/v1/models)
            [ "$CODE" = "200" ] && report "Anthropic ($AK)" ok "key valid, models listable" \
                                || report "Anthropic ($AK)" fail "HTTP $CODE from api.anthropic.com"
          else
            report "Anthropic" skip "no secret found (needed for Phase 4)"
          fi

          # ---- ElevenLabs (Phase 4) ----
          EK=$(find_key ELEVENLABS_API_KEY ELEVEN_LABS_API_KEY ELEVENLABS_KEY XI_API_KEY)
          if [ -n "$EK" ]; then
            CODE=$(curl -s -o /tmp/eleven.json -w '%{http_code}' \
              -H "xi-api-key: $(get $EK)" https://api.elevenlabs.io/v1/user)
            if [ "$CODE" = "200" ]; then
              TIER=$(jq -r '.subscription.tier // "unknown"' /tmp/eleven.json)
              report "ElevenLabs ($EK)" ok "key valid (tier: $TIER)"
            else
              report "ElevenLabs ($EK)" fail "HTTP $CODE from api.elevenlabs.io"
            fi
          else
            report "ElevenLabs" skip "no secret found (needed for Phase 4)"
          fi

          # ---- fal.ai (Phase 5) ----
          FK=$(find_key FAL_KEY FAL_API_KEY FAL_AI_KEY FAL_AI_API_KEY FAL_AI_FULL_ACCESS_DEVELOPMENT_KEY)
          if [ -n "$FK" ]; then
            # No dedicated auth-check endpoint: a status probe returns 401/403
            # only when the key itself is rejected.
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Key $(get $FK)" \
              "https://queue.fal.run/fal-ai/flux/requests/00000000-0000-0000-0000-000000000000/status")
            case "$CODE" in
              401|403) report "fal.ai ($FK)" fail "key rejected (HTTP $CODE)";;
              *)       report "fal.ai ($FK)" ok "key accepted (probe HTTP $CODE)";;
            esac
          else
            report "fal.ai" skip "no secret found (needed for Phase 5)"
          fi

          # ---- TwelveLabs (Tier-2 vision optimizer loop) ----
          # Temporal video understanding for the auto-fix loop. List indexes —
          # an authenticated GET that returns 200 only with a valid key.
          TLK=$(find_key TWELVELABS_API_KEY TWELVE_LABS_API_KEY TWELVELABS_KEY TWELVE_LABS_KEY TL_API_KEY)
          if [ -n "$TLK" ]; then
            CODE=$(curl -s -o /tmp/tl.json -w '%{http_code}' \
              -H "x-api-key: $(get $TLK)" \
              "https://api.twelvelabs.io/v1.3/indexes?page_limit=1")
            if [ "$CODE" = "200" ]; then
              report "TwelveLabs ($TLK)" ok "key valid, indexes listable"
            else
              ERR=$(jq -r '.message // .error // empty' /tmp/tl.json 2>/dev/null)
              report "TwelveLabs ($TLK)" fail "HTTP $CODE from api.twelvelabs.io${ERR:+ — $ERR}"
            fi
          else
            report "TwelveLabs" skip "no secret found (needed for Tier-2 vision auto-fix loop)"
          fi

          # ---- Telegram (Auto Pilot Operator approvals + digest) ----
          # getMe validates the bot token; getChat validates the chat id (the bot
          # must have been messaged first so it can see the chat).
          TGT=$(find_key TELEGRAM_BOT_TOKEN TELEGRAM_TOKEN TELEGRAM_BOT)
          if [ -n "$TGT" ]; then
            CODE=$(curl -s -o /tmp/tg.json -w '%{http_code}' "https://api.telegram.org/bot$(get $TGT)/getMe")
            if [ "$CODE" = "200" ] && jq -e '.ok' /tmp/tg.json >/dev/null 2>&1; then
              UN=$(jq -r '.result.username // "ok"' /tmp/tg.json)
              report "Telegram bot ($TGT)" ok "token valid — @$UN"
              TGC=$(find_key TELEGRAM_CHAT_ID TELEGRAM_CHAT)
              if [ -n "$TGC" ]; then
                CC=$(curl -s -o /tmp/tgc.json -w '%{http_code}' \
                  "https://api.telegram.org/bot$(get $TGT)/getChat?chat_id=$(get $TGC)")
                if [ "$CC" = "200" ] && jq -e '.ok' /tmp/tgc.json >/dev/null 2>&1; then
                  report "Telegram chat ($TGC)" ok "chat id reachable"
                else
                  ERR=$(jq -r '.description // empty' /tmp/tgc.json 2>/dev/null)
                  report "Telegram chat ($TGC)" fail "getChat HTTP $CC${ERR:+ — $ERR} (message the bot once so it can see you)"
                fi
              else
                report "Telegram chat" skip "TELEGRAM_CHAT_ID not set"
              fi
            else
              report "Telegram bot ($TGT)" fail "getMe HTTP $CODE — token rejected"
            fi
          else
            report "Telegram" skip "no bot token (needed for Auto Pilot approvals/digest)"
          fi

          # ---- Pexels (Phase 5) ----
          PK=$(find_key PEXELS_API_KEY PEXELS_KEY)
          if [ -n "$PK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: $(get $PK)" \
              "https://api.pexels.com/v1/curated?per_page=1")
            [ "$CODE" = "200" ] && report "Pexels ($PK)" ok "key valid" \
                                || report "Pexels ($PK)" fail "HTTP $CODE from api.pexels.com"
          else
            report "Pexels" skip "no secret found (needed for Phase 5)"
          fi

          # ---- Pixabay (Phase 6.5 — optional extra source) ----
          PXK=$(find_key PIXABAY_API_KEY PIXABAY_KEY)
          if [ -n "$PXK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pixabay.com/api/?key=$(get $PXK)&q=test&per_page=3")
            [ "$CODE" = "200" ] && report "Pixabay ($PXK)" ok "key valid" \
                                || report "Pixabay ($PXK)" fail "HTTP $CODE from pixabay.com"
          else
            report "Pixabay" skip "optional — widens the Source Library pool (Phase 6.5)"
          fi

          # ---- Trigger.dev ----
          TK=$(find_key TRIGGER_SECRET_KEY TRIGGER_API_KEY TRIGGER_DEV_API_KEY TRIGGER_KEY TRIGGER_DEV_SECRET_KEY)
          if [ -n "$TK" ]; then
            TV=$(get "$TK")
            case "$TV" in
              tr_*) FMT="key format valid (tr_…)";;
              *)    FMT="unexpected key format (expected tr_…)";;
            esac
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TV" https://api.trigger.dev/api/v1/whoami)
            if [ "$CODE" = "200" ]; then
              report "Trigger.dev ($TK)" ok "authenticated; $FMT"
            else
              case "$TV" in
                tr_*) report "Trigger.dev ($TK)" ok "$FMT (whoami endpoint returned $CODE — full validation at first deploy)";;
                *)    report "Trigger.dev ($TK)" fail "$FMT and API returned $CODE";;
              esac
            fi
          else
            report "Trigger.dev" skip "no secret found matching TRIGGER_*"
          fi

          echo ""
          echo "==== SUMMARY: $PASS passed, $FAIL failed, $SKIP missing/skipped ===="
          [ "$FAIL" -eq 0 ] || exit 1

