name: Long Clip Worker

# Produces long clips (Veo-3.1 extend / auto-stitch) for queued clip_jobs.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - packages/clips/**
      - .github/workflows/clips.yml

concurrency:
  group: long-clips
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Idle-cron guard (Phase 8): peek at the queue with one cheap REST call
      # BEFORE checkout/install — an empty queue used to cost a full runner
      # spin-up every pass. Dispatched runs skip the peek.
      - name: Check for queued work
        id: peek
        if: github.event_name == 'schedule'
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          COUNT=$(curl -s "https://reffwibuitzrkertuuvy.supabase.co/rest/v1/clip_jobs?select=id&status=eq.queued" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" -D - -o /dev/null \
            | tr -d '\r' | awk -F'/' 'tolower($0) ~ /^content-range:/ {print $NF}')
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "clip queue: ${COUNT:-0}"
      - name: Queue empty — exit early
        if: github.event_name == 'schedule' && steps.peek.outputs.count == '0'
        run: echo "Nothing queued — skipping checkout/install."
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      - name: Install ffmpeg
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg && ffmpeg -version | head -1
      - uses: pnpm/action-setup@v6
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @studio/clips...
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      - name: Run clip queue
        # Same guard as every step above: an empty scheduled queue skipped
        # checkout, so packages/clips doesn't exist — running here would fail.
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        working-directory: packages/clips
        env:
          SUPABASE_URL: https://reffwibuitzrkertuuvy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY || secrets.FAL_AI_FULL_ACCESS_DEVELOPMENT_KEY }}
        run: pnpm clip-queue
