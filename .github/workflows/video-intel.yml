name: Video Intel Worker

# Deep-perception worker for the operator-vouched PRECISE frame lane: picks up
# video_intel rows at status='queued', samples frames (yt-dlp + ffmpeg), runs
# them through Claude vision, and writes the blueprint. Analysis only.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - packages/intel/**
      - .github/workflows/video-intel.yml

concurrency:
  group: video-intel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  perceive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Idle-cron guard (Phase 8): peek at the queue with one cheap REST call
      # BEFORE checkout/install — an empty queue used to cost a full runner
      # spin-up every pass. Dispatched runs skip the peek.
      - name: Check for queued work
        id: peek
        if: github.event_name == 'schedule'
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          COUNT=$(curl -s "https://reffwibuitzrkertuuvy.supabase.co/rest/v1/video_intel?select=id&status=eq.queued" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" -D - -o /dev/null \
            | tr -d '\r' | awk -F'/' 'tolower($0) ~ /^content-range:/ {print $NF}')
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "intel queue: ${COUNT:-0}"
      - name: Queue empty — exit early
        if: github.event_name == 'schedule' && steps.peek.outputs.count == '0'
        run: echo "Nothing queued — skipping checkout/install."
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      - name: Install ffmpeg + yt-dlp
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        env:
          # Pin yt-dlp to a specific release (not 'latest') and verify the
          # binary against that release's published SHA2-256SUMS before making
          # it executable. 'latest' + no verification means a compromised or
          # MITM'd release runs arbitrary code in a job holding the
          # service-role + provider keys. Bump YTDLP_VERSION to update.
          YTDLP_VERSION: "2025.06.09"
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg
          base="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}"
          curl -fsSL "${base}/yt-dlp" -o /tmp/yt-dlp
          curl -fsSL "${base}/SHA2-256SUMS" -o /tmp/yt-dlp.sums
          want=$(grep -E '  yt-dlp$' /tmp/yt-dlp.sums | awk '{print $1}')
          got=$(sha256sum /tmp/yt-dlp | awk '{print $1}')
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "yt-dlp checksum mismatch (want=$want got=$got) — refusing to install"; exit 1
          fi
          sudo install -m 0755 /tmp/yt-dlp /usr/local/bin/yt-dlp
          yt-dlp --version && ffmpeg -version | head -1
      - uses: pnpm/action-setup@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        with:
          node-version: 22
          cache: pnpm
      - name: Install worker deps
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        run: pnpm install --frozen-lockfile --filter @studio/intel...
      - name: Run intel queue
        if: github.event_name != 'schedule' || steps.peek.outputs.count != '0'
        working-directory: packages/intel
        env:
          SUPABASE_URL: https://reffwibuitzrkertuuvy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm intel-queue
